# =============================================================================
#  PIPELINE DE INTEGRACIÓN CONTINUA (Commit Stage) — Examen Final ADP1323
#  Etapas: build -> pruebas unitarias -> pruebas de integración (Selenium)
#          -> análisis de seguridad (SAST/SCA) -> reportes -> notificación
# =============================================================================
name: CI - Build y Pruebas Automatizadas

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + pruebas unitarias + pruebas de integración
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar el proyecto
        run: mvn -B clean compile

      - name: Ejecutar pruebas UNITARIAS (JUnit 5 / Surefire)
        run: mvn -B test

      - name: Ejecutar pruebas de INTEGRACIÓN (Selenium / Failsafe)
        run: mvn -B verify -DskipTests=false
        # Chrome ya viene preinstalado en el runner ubuntu-latest;
        # WebDriverManager descarga el chromedriver compatible en tiempo de ejecución.

      - name: Calcular clave de cache semanal (BD de CVEs)
        id: semana
        run: echo "semana=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restaurar cache de la base de datos de CVEs (OWASP NVD)
        id: cache-nvd
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          key: dependency-check-data-${{ steps.semana.outputs.semana }}
          restore-keys: |
            dependency-check-data-

      - name: Analizar dependencias en busca de CVEs (SCA)
        run: mvn -B org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Generar reporte HTML navegable (Surefire + Failsafe)
        if: always()
        run: mvn -B surefire-report:report-only site:site -DgenerateReports=false

      - name: Publicar resultados en el resumen del build
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados de pruebas
          path: 'target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Publicar artefacto (JAR) y reportes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-y-reportes
          path: |
            target/*.jar
            target/surefire-reports/
            target/failsafe-reports/
            target/site/
            target/dependency-check-report.html
          retention-days: 30

      - name: Guardar cache de la base de datos de CVEs (OWASP NVD)
        if: always() && steps.cache-nvd.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dependency-check-data
          key: dependency-check-data-${{ steps.semana.outputs.semana }}

      - name: Alerta a Slack si el build falló
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":rotating_light: *CI fallido* en `${{ github.repository }}`\n*Rama:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver ejecución>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  sast:
    name: Análisis estático de código (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Compilar para el análisis
        run: mvn -B -DskipTests clean compile

      - name: Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------
  # JOB 3: prueba de performance (k6) -- practica de la Unidad II, aplicada
  #         aqui sobre el login real de esta app (antes apuntaba a una API
  #         de prueba externa). Corre en paralelo al SAST, solo si el build
  #         y las pruebas funcionales ya pasaron.
  # ---------------------------------------------------------------------------
  performance:
    name: Prueba de performance (k6) sobre el login
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Empaquetar la aplicacion (sin tests, ya corrieron en build-and-test)
        run: mvn -B -DskipTests clean package

      - name: Levantar la aplicacion en segundo plano
        run: |
          nohup java -jar target/app-inventario-tienda-*.jar > app.log 2>&1 &
          echo "Esperando a que /actuator/health responda..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "::error::La aplicacion no respondio a tiempo"; cat app.log; exit 1

      - name: Preparar carpeta de resultados
        run: mkdir -p performance/resultados

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar prueba de carga sobre el login
        run: k6 run performance/login-performance.js --summary-export=performance/resultados/summary-export.json
        env:
          BASE_URL: http://localhost:8080
        continue-on-error: true   # una degradacion no bloquea el merge, pero si alerta

      - name: Publicar resultados de performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-performance-k6
          path: performance/resultados/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 4: dashboard navegable + alertas -- practica de la Unidad II.
  #         Publica todos los reportes (unitarias, integracion, performance)
  #         en GitHub Pages y abre un issue automatico si algo fallo en master.
  # ---------------------------------------------------------------------------
  reportes-y-alertas:
    name: Dashboard y alertas
    runs-on: ubuntu-latest
    needs: [ build-and-test, sast, performance ]
    if: always()
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los reportes
        uses: actions/download-artifact@v4
        with:
          path: reportes/

      # download-artifact solo deja los reportes crudos (jar, XML de
      # Surefire, HTML de dependency-check, JSON de k6) sin ninguna pagina
      # de inicio que los enlace, asi que la URL raiz del dashboard daba
      # 404 pese a publicarse correctamente. Se genera un indice simple
      # para que el dashboard sea realmente navegable como dice el
      # comentario de mas abajo.
      - name: Generar indice del dashboard
        if: github.ref == 'refs/heads/master'
        run: |
          cat > reportes/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <title>Dashboard - app-inventario-tienda</title>
            <style>
              body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; line-height: 1.6; }
              h1 { font-size: 1.4rem; }
              ul { padding-left: 1.2rem; }
              a { color: #0969da; }
            </style>
          </head>
          <body>
            <h1>Dashboard de CI - app-inventario-tienda</h1>
            <p>Reportes generados por el pipeline de CI en la ultima ejecucion sobre master.</p>
            <ul>
              <li><a href="build-y-reportes/dependency-check-report.html">Reporte de dependencias (OWASP Dependency-Check)</a></li>
              <li><a href="build-y-reportes/site/surefire-report.html">Reporte de pruebas unitarias (Surefire)</a></li>
              <li><a href="reporte-performance-k6/summary.json">Resumen de performance (k6, JSON)</a></li>
            </ul>
          </body>
          </html>
          HTML

      # Publica los reportes en GitHub Pages: URL fija y navegable para
      # todo el equipo, sin necesidad de descargar artefactos.
      # Requiere habilitar Settings -> Pages -> Source: rama "gh-pages".
      - name: Publicar dashboard en GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reportes
          destination_dir: dashboard

      - name: Crear issue automático ante fallo en master
        if: needs.build-and-test.result == 'failure' && github.ref == 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] Fallo automático en master - run #${context.runNumber}`,
              body: `El pipeline falló en el commit ${context.sha}.\nRevisar: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci', 'bug', 'prioridad-alta']
            })
