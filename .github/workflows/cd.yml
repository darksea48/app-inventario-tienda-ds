# =============================================================================
#  PIPELINE DE DESPLIEGUE (CD) — Examen Final ADP1323
#  Se dispara solo si el CI de master terminó en verde.
#  Etapas: build del artefacto -> deploy al color inactivo -> acceptance
#          tests (BDD) -> DAST -> conmutación -> monitoreo -> auditoría
#          -> rollback si corresponde.
#
#  NOTA IMPORTANTE (léela antes de ejecutar en tu cuenta):
#  Los runners "ubuntu-latest" de GitHub son efímeros: se crean y se
#  destruyen en cada ejecución, así que los contenedores app_blue/app_green
#  NO persisten de una ejecución a la siguiente tal como está escrito este
#  workflow. Para que la conmutación Blue-Green tenga sentido real (que el
#  color que quedó activo la vez anterior siga corriendo la próxima vez),
#  este job debe correr en un self-hosted runner registrado en tu propio
#  equipo (Settings -> Actions -> Runners -> New self-hosted runner), donde
#  sí persiste el estado de Docker entre ejecuciones. Mientras tanto, puedes
#  ejecutar estos mismos pasos a mano en tu equipo con
#  docker compose -f deploy/docker-compose.yml (ver README.md) y capturar
#  esa evidencia.
# =============================================================================
name: CD - Despliegue Blue-Green

on:
  workflow_run:
    workflows: ["CI - Build y Pruebas Automatizadas"]
    branches: [ master ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  deploy-blue-green:
    name: Desplegar en entorno de pruebas (Blue-Green)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: staging   # habilita el gate/aprobación de GitHub Environments (§4.6)
    env:
      # Los secrets no se pueden usar directamente en un "if:" de un step;
      # se exponen primero como variable de entorno del job para poder
      # condicionar sobre ella (queda vacía si el secret no esta configurado).
      SLACK_WEBHOOK_CONFIGURADO: ${{ secrets.SLACK_WEBHOOK_URL != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Levantar el entorno de pruebas (si no existe todavía)
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Determinar color inactivo
        id: color
        run: |
          ACTIVO=$(grep -oP 'proxy_pass http://app_\K(blue|green)' deploy/nginx-activo.conf | head -n1)
          INACTIVO=$([[ "$ACTIVO" == "blue" ]] && echo "green" || echo "blue")
          echo "activo=$ACTIVO" >> "$GITHUB_OUTPUT"
          echo "inactivo=$INACTIVO" >> "$GITHUB_OUTPUT"
          echo "puerto_inactivo=$([[ "$INACTIVO" == "blue" ]] && echo 8081 || echo 8082)" >> "$GITHUB_OUTPUT"

      - name: Construir y desplegar la imagen en el color inactivo
        run: |
          docker build -t app-inventario:${{ github.sha }} .
          docker stop app_${{ steps.color.outputs.inactivo }} || true
          docker rm app_${{ steps.color.outputs.inactivo }} || true
          docker run -d --name app_${{ steps.color.outputs.inactivo }} \
            -p ${{ steps.color.outputs.puerto_inactivo }}:8080 \
            app-inventario:${{ github.sha }}
          sleep 5

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar acceptance tests BDD contra el color inactivo
        run: |
          mvn -B test -Dtest=BddAcceptanceRunner \
            -Dacceptance.target.url=http://localhost:${{ steps.color.outputs.puerto_inactivo }}

      - name: Escaneo de seguridad dinámico (DAST) con OWASP ZAP
        # v0.12.0 usaba una integracion con upload-artifact ya deprecada,
        # lo que causaba fallos intermitentes 'Create Artifact Container
        # failed: ... is not valid' al subir el reporte zap_scan (bug
        # conocido, corregido en v0.14.0 al actualizar esa dependencia).
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:${{ steps.color.outputs.puerto_inactivo }}'
          cmd_options: '-a'
          fail_action: false
          # No necesitamos que ZAP abra/actualice un Issue de GitHub con el
          # reporte (no tenemos ese flujo de triage configurado para el examen),
          # y el token del workflow no tiene permiso issues:write, lo que hacia
          # fallar este paso con 'Resource not accessible by integration' al
          # intentar crear el issue (aunque fail_action=false evita que el
          # build fallara por hallazgos de ZAP en si).
          allow_issue_writing: false

      - name: Conmutar tráfico al color recién validado
        run: ./deploy/blue-green-switch.sh --to ${{ steps.color.outputs.inactivo }}

      - name: Monitorear salud del color activo (ventana de 2 minutos)
        id: monitoreo
        run: ./deploy/monitorear-salud.sh --minutos 2 --url http://localhost:8080/actuator/health
        continue-on-error: true

      - name: Rollback automático si el monitoreo detectó una falla
        if: steps.monitoreo.outcome == 'failure'
        run: |
          ./deploy/blue-green-switch.sh --rollback
          echo "::error::Rollback ejecutado: el color recién desplegado no fue estable."

      - name: Registrar el evento en el log de auditoría
        if: always()
        run: |
          echo "$(date -u +%FT%TZ),${{ github.sha }},${{ github.actor }},${{ steps.color.outputs.inactivo }},${{ job.status }}" >> docs/auditoria-despliegues.csv

      - name: Publicar el log de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-despliegues
          path: docs/auditoria-despliegues.csv
          retention-days: 90

      - name: Alerta a Slack ante rollback
        # Ademas de exigir que el monitoreo haya fallado, se exige que el
        # secret SLACK_WEBHOOK_URL este configurado: sin esta condicion, la
        # accion de Slack falla con "Need to provide at least one botToken
        # or webhookUrl" cuando el repo no tiene el webhook configurado
        # (como es el caso de este examen), tumbando todo el job aunque el
        # rollback en si haya funcionado correctamente.
        if: steps.monitoreo.outcome == 'failure' && env.SLACK_WEBHOOK_CONFIGURADO == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": ":leftwards_arrow_with_hook: *Rollback ejecutado* en `${{ github.repository }}`\n*Commit:* ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver ejecución>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
