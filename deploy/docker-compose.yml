# Entorno de pruebas (staging) simulado localmente -- Actividad 3, §4.1 del
# informe. Levanta las dos réplicas (BLUE/GREEN) y el proxy que decide cuál
# de las dos recibe tráfico.
#
# Uso:
#   docker compose -f deploy/docker-compose.yml up -d --build
#   ./deploy/blue-green-switch.sh --to green
#
version: "3.8"

services:
  app_blue:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: app_blue
    ports:
      - "8081:8080"
    restart: unless-stopped

  app_green:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: app_green
    ports:
      - "8082:8080"
    restart: unless-stopped

  proxy-nginx:
    image: nginx:1.27-alpine
    container_name: proxy-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx-activo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app_blue
      - app_green
    restart: unless-stopped
