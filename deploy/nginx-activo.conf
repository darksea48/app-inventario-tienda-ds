# Config activa del proxy -- Actividad 3 (Blue-Green), §4.1 y §4.7 del informe.
#
# Esta es la ÚNICA línea que cambia el color activo: blue-green-switch.sh
# la reescribe con sed. NO editar el resto del archivo a mano.
#
# Color activo actual: BLUE (estado inicial de referencia).

server {
    listen 8080;

    location / {
        proxy_pass http://app_blue:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /actuator/health {
        proxy_pass http://app_blue:8080/actuator/health;
    }
}
